---
name: Build and Deploy Nightly Docker Image
on:
  schedule:
    - cron: '0 22 * * *'  # Every night at 10pm UTC
  workflow_dispatch:
    inputs:
      comfyui_ref:
        description: ComfyUI ref to test against the checked-in custom-node lockset
        required: false
        default: master

jobs:
  build-and-test:
    strategy:
      matrix:
        cuda:
          - base_image: nvidia/cuda:13.0.2-cudnn-devel-ubuntu24.04
            torch_cuda: cu130
            tag_suffix: cuda13.0
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build Docker image
        run: |
          COMFYUI_REF="${{ github.event.inputs.comfyui_ref || 'master' }}"
          echo "Building nightly against ComfyUI ref: ${COMFYUI_REF}"
          docker build \
            --no-cache \
            --build-arg COMFYUI_REF="${COMFYUI_REF}" \
            --build-arg BASE_IMAGE=${{ matrix.cuda.base_image }} \
            --build-arg TORCH_CUDA=${{ matrix.cuda.torch_cuda }} \
            -t michaelgold/comfy3d:nightly \
            -f Docker/Dockerfile.nightly .
      - name: Test container
        run: |
          # Remove existing container if it exists
          docker rm -f comfy-test || true
          rm -f /tmp/object_info.json
          docker run -d -p 8234:8188 --name comfy-test --runtime=nvidia --gpus all michaelgold/comfy3d:nightly
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8234/object_info >/tmp/object_info.json; then
              echo "✅ ComfyUI /object_info is ready"
              break
            fi
            sleep 2
          done
          docker logs comfy-test > logs.txt 2>&1
          cat logs.txt
          if grep -E "IMPORT FAILED|Cannot import|Traceback" logs.txt; then
            echo "❌ Custom node import failure detected" && exit 1
          fi
          test -s /tmp/object_info.json || (echo "❌ ComfyUI /object_info did not become ready" && exit 1)
          docker stop comfy-test
          docker rm comfy-test

  push:
    needs: build-and-test
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60
    strategy:
      matrix:
        cuda:
          - tag_suffix: cuda12.6
            latest: true
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push to Docker Hub
        run: |
          docker push michaelgold/comfy3d:nightly
